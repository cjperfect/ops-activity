server:
  port: ${USER_SERVER_PORT:8090}

spring:
  config:
    import: optional:file:${NACOS_CREDENTIALS_FILE:./config/nacos-local.properties}
  application:
    name: user-server
  cloud:
    nacos:
      discovery:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8858}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:ACTIVITY_GROUP}
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:activity}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&remarks=true&useInformationSchema=true
    username: ${MYSQL_USER:chenjiang}
    password: ${MYSQL_PASSWORD:chenjiang}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL，上线关掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: true
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.activity.userserver.mapper: debug
