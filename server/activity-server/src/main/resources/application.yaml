server:
  port: ${ACTIVITY_SERVER_PORT:8092}

spring:
  config:
    # 从项目根目录启动，或使用环境变量指定凭证文件绝对路径。
    import: optional:file:${NACOS_CREDENTIALS_FILE:./config/nacos-local.properties}
  application:
    name: activity-server
  cloud:
    nacos:
      discovery:
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8858}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:ACTIVITY_GROUP}
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:activity}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&remarks=true&useInformationSchema=true
    username: ${MYSQL_USER:chenjiang}
    password: ${MYSQL_PASSWORD:chenjiang}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.activity.activityserver.mapper: ${MYBATIS_LOG_LEVEL:info}
