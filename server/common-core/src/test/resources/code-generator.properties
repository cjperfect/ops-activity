# Required: configure locally or use GENERATOR_JDBC_URL / GENERATOR_JDBC_USERNAME.
# MySQL example: jdbc:mysql://localhost:3306/activity?useUnicode=true&characterEncoding=UTF-8&remarks=true&useInformationSchema=true
generator.jdbc.url=
generator.jdbc.username=
# Prefer GENERATOR_JDBC_PASSWORD or -Dgenerator.jdbc.password; do not commit credentials.
generator.jdbc.password=

# Explicit table list, separated by commas, e.g. t_activity,t_activity_record.
generator.tables=
generator.table-prefixes=t_
generator.package=com.activity.appmanage
generator.author=activity
# Relative to the IDE run configuration working directory. Can be an absolute module path.
# Generated Java: <output>/src/main/java; XML: <output>/src/main/resources/mapper.
generator.output-dir=target/generated-code
