server:
  port: ${APP_MANAGE_PORT:8080}

spring:
  application:
    name: app-manage
  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/activity?useSSL=false&serverTimezone=UTC
    username: chenjiang
    password: chenjiang

  # OpenFeign 通过 Nacos 服务名调用
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8858}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:ACTIVITY_GROUP}
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}
    openfeign:
      client:
        config:
          user-server:
            connect-timeout: 3000
            read-timeout: 5000
